<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Test Sessions - Web Platform Test</title>
    <link rel="stylesheet" href="css/bulma-1.0.0/bulma.min.css" />
    <link rel="stylesheet" href="css/fontawesome-6.5.2.min.css" />
    <script src="lib/wave-service.js"></script>
    <style>
      .site-logo {
        max-width: 300px;
        margin: 0 0 30px -15px;
      }

      .status-box {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <section class="section">
      <div class="container" style="margin-bottom: 2em">
        <a href="index.html">
          <img src="res/wavelogo_2016.jpg" class="site-logo" alt="WAVE" />
        </a>
        <h1 class="title">Test Sessions</h1>
      </div>

      <div class="container" id="table-container"></div>
    </section>

    <script>
      (function() {
        const state = {
          sessions: [],
          manufacturerByDeviceId: {},
          hbbtvByDeviceId: {},
          loading: true,
          error: null,
          selectedTokens: {},
          editingToken: null,
          editingDetails: "",
          saving: false,
        };

        function formatDate(value) {
          if (!value) return "-";
          const date = new Date(value);
          if (Number.isNaN(date.getTime())) return String(value);
          return date.toLocaleString();
        }

        function shortToken(token) {
          if (!token) return "";
          return String(token).slice(0, 8);
        }

        function sessionResultsUrl(token) {
          return (
            "http://web-platform.test:8000/_wave/results.html?token=" +
            encodeURIComponent(String(token || ""))
          );
        }

        function deviceResultsUrl(deviceId) {
          return (
            "http://web-platform.test:8000/_wave/devices.html?device_id=" +
            encodeURIComponent(String(deviceId || ""))
          );
        }

        function getStatusTagStyle(status) {
          switch (status) {
            case "completed":
              return "is-success";
            case "running":
              return "is-info";
            case "aborted":
              return "is-danger";
            case "paused":
              return "is-warning";
            case "pending":
              return "is-primary";
            default:
              return "";
          }
        }

        function escapeHtml(value) {
          return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function readManufacturerForSession(session) {
          const rawDeviceId = session ? session.device_id : null;
          if (rawDeviceId === undefined || rawDeviceId === null) {
            return "-";
          }
          const deviceId = String(rawDeviceId).trim();
          if (deviceId === "") {
            return "-";
          }
          const manufacturer = state.manufacturerByDeviceId[deviceId];
          if (manufacturer === undefined || manufacturer === null) {
            return "-";
          }
          const text = String(manufacturer).trim();
          return text === "" ? "-" : text;
        }

        function readHbbtvForSession(session) {
          const rawDeviceId = session ? session.device_id : null;
          if (rawDeviceId === undefined || rawDeviceId === null) {
            return "-";
          }
          const deviceId = String(rawDeviceId).trim();
          if (deviceId === "") {
            return "-";
          }
          const hbbtvVersion = state.hbbtvByDeviceId[deviceId];
          if (hbbtvVersion === undefined || hbbtvVersion === null) {
            return "-";
          }
          const text = String(hbbtvVersion).trim();
          return text === "" ? "-" : text;
        }

        function renderStatus(container) {
          if (state.loading) {
            container.innerHTML =
              '<div class="level"><span class="level-item"><i class="fas fa-spinner fa-pulse"></i><span style="margin-left:0.4em;">Loading sessions ...</span></span></div>';
            return true;
          }

          if (state.error) {
            container.innerHTML =
              '<article class="message is-danger status-box"><div class="message-body">' +
              escapeHtml(state.error) +
              "</div></article>";
            return true;
          }

          if (!state.sessions || state.sessions.length === 0) {
            container.innerHTML =
              '<div class="level"><span class="level-item">No sessions available.</span></div>';
            return true;
          }

          return false;
        }

        function renderTable() {
          const container = document.getElementById("table-container");
          if (renderStatus(container)) return;

          const allSelected =
            state.sessions.length > 0 &&
            state.sessions.every(function(session) {
              return !!state.selectedTokens[session.token];
            });

          const rows = state.sessions
            .map(function(session) {
              const hasDeviceId =
                session.device_id !== undefined &&
                session.device_id !== null &&
                String(session.device_id).trim() !== "";

              const deviceCell = hasDeviceId
                ? '<a href="' +
                  escapeHtml(deviceResultsUrl(session.device_id)) +
                  '">' +
                  escapeHtml(session.device_id) +
                  "</a>"
                : "-";

              const isSelected = !!state.selectedTokens[session.token];
              const isEditing =
                state.editingToken !== null &&
                String(state.editingToken) === String(session.token || "");

              const detailsCell = isEditing
                ? '<input class="input is-small details-edit-input" data-token="' +
                  escapeHtml(session.token) +
                  '" value="' +
                  escapeHtml(state.editingDetails) +
                  '" />'
                : escapeHtml(
                    String(session.details || "").trim() !== ""
                      ? session.details
                      : "-"
                  );

              const editButton = isEditing
                ? '<button class="button is-small is-success session-save-button" data-token="' +
                  escapeHtml(session.token) +
                  '" aria-label="Save" title="Save"' +
                  (state.saving ? " disabled" : "") +
                  '><span class="icon is-small"><i class="fas fa-floppy-disk" aria-hidden="true"></i></span></button>'
                : '<button class="button is-small session-edit-button" data-token="' +
                  escapeHtml(session.token) +
                  '" aria-label="Edit" title="Edit"><span class="icon is-small"><i class="fas fa-pen" aria-hidden="true"></i></span></button>';

              return (
                "<tr>" +
                '<td class="is-narrow has-text-centered">' +
                '<input type="checkbox" class="session-select" data-token="' +
                escapeHtml(session.token) +
                '"' +
                (isSelected ? " checked" : "") +
                " />" +
                "</td>" +
                '<td class="is-family-monospace">' +
                '<a href="' +
                escapeHtml(sessionResultsUrl(session.token)) +
                '">' +
                escapeHtml(shortToken(session.token)) +
                "</a>" +
                "</td>" +
                '<td class="is-narrow">' +
                escapeHtml(formatDate(session.date_started)) +
                "</td>" +
                '<td style="width: 8rem; max-width: 8rem; word-break: break-word">' +
                escapeHtml(readManufacturerForSession(session)) +
                "</td>" +
                '<td style="width: 9rem; max-width: 9rem; word-break: break-word">' +
                escapeHtml(readHbbtvForSession(session)) +
                "</td>" +
                '<td class="is-narrow">' +
                deviceCell +
                "</td>" +
                '<td class="is-narrow">' +
                escapeHtml(session.test_files || 0) +
                "</td>" +
                '<td style="vertical-align: middle; text-align: center">' +
                '<span class="tag ' +
                getStatusTagStyle(session.session_status) +
                '">' +
                escapeHtml(session.session_status || "unknown") +
                "</span>" +
                "</td>" +
                "<td>" +
                escapeHtml(
                  Array.isArray(session.labels) && session.labels.length > 0
                    ? session.labels.join(", ")
                    : "-"
                ) +
                "</td>" +
                '<td style="white-space: normal; word-break: break-word">' +
                detailsCell +
                "</td>" +
                '<td class="is-narrow has-text-centered">' +
                editButton +
                "</td>" +
                '<td class="is-narrow has-text-centered">' +
                '<button class="button is-small is-danger is-light" data-token="' +
                escapeHtml(session.token) +
                '">' +
                '<span class="icon"><i class="fas fa-trash-alt"></i></span>' +
                "</button>" +
                "</td>" +
                "</tr>"
              );
            })
            .join("");

          container.innerHTML =
            '<table class="table is-bordered is-hoverable is-fullwidth">' +
            "<thead>" +
            "<tr>" +
            '<th class="is-narrow has-text-centered">' +
            '<input type="checkbox" id="select-all-sessions"' +
            (allSelected ? " checked" : "") +
            " />" +
            "</th>" +
            '<th class="is-narrow">Token</th>' +
            '<th class="is-narrow">Date Started</th>' +
            '<th style="width: 8rem; max-width: 8rem">Manufacturer</th>' +
            '<th style="width: 6rem; max-width: 6rem">HbbTV Version</th>' +
            '<th class="is-narrow">#Device</th>' +
            '<th class="is-narrow">Test Files</th>' +
            '<th class="is-narrow">Status</th>' +
            '<th class="is-narrow">Labels</th>' +
            "<th>Details</th>" +
            '<th class="is-narrow">Edit</th>' +
            '<th class="is-narrow">Delete</th>' +
            "</tr>" +
            "</thead>" +
            "<tbody>" +
            rows +
            "</tbody>" +
            "</table>";

          Array.prototype.slice
            .call(container.querySelectorAll("button[data-token]"))
            .forEach(function(button) {
              if (button.classList.contains("session-edit-button")) return;
              if (button.classList.contains("session-save-button")) return;
              button.addEventListener("click", function() {
                const token = button.getAttribute("data-token");
                handleDelete(token);
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("button.session-edit-button[data-token]"))
            .forEach(function(button) {
              button.addEventListener("click", function() {
                const token = button.getAttribute("data-token");
                const session = state.sessions.find(function(item) {
                  return String(item.token || "") === String(token || "");
                });
                if (!session) return;
                state.editingToken = token;
                state.editingDetails = String(session.details || "");
                state.error = null;
                renderTable();
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("button.session-save-button[data-token]"))
            .forEach(function(button) {
              button.addEventListener("click", function() {
                const token = button.getAttribute("data-token");
                saveDetails(token);
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("input.details-edit-input[data-token]"))
            .forEach(function(input) {
              input.addEventListener("input", function() {
                state.editingDetails = input.value;
              });
            });


        function saveDetails(token) {
          if (!token) return;
          state.saving = true;
          state.error = null;
          renderTable();

          WaveService.updateTestSessionDetails(
            token,
            state.editingDetails,
            function() {
              state.sessions = state.sessions.map(function(session) {
                if (String(session.token || "") !== String(token || "")) {
                  return session;
                }
                return {
                  token: session.token,
                  user_agent: session.user_agent,
                  session_status: session.session_status,
                  date_started: session.date_started,
                  test_files: session.test_files,
                  details: state.editingDetails,
                  device_id: session.device_id,
                  labels: session.labels,
                };
              });
              state.saving = false;
              state.editingToken = null;
              state.editingDetails = "";
              renderTable();
            },
            function(status) {
              state.saving = false;
              state.error =
                "Failed to update details" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );
        }
          const selectAll = container.querySelector("#select-all-sessions");
          if (selectAll) {
            selectAll.addEventListener("change", function() {
              const checked = !!selectAll.checked;
              state.sessions.forEach(function(session) {
                state.selectedTokens[session.token] = checked;
              });
              renderTable();
            });
          }

          Array.prototype.slice
            .call(container.querySelectorAll("input.session-select[data-token]"))
            .forEach(function(checkbox) {
              checkbox.addEventListener("change", function() {
                const token = checkbox.getAttribute("data-token");
                if (!token) return;
                state.selectedTokens[token] = !!checkbox.checked;
                renderTable();
              });
            });
        }

        function loadSessions() {
          state.loading = true;
          state.error = null;
          renderTable();

          let sessionsLoaded = false;
          let devicesLoaded = false;

          function finishIfDone() {
            if (!sessionsLoaded || !devicesLoaded) {
              return;
            }
            state.loading = false;
            renderTable();
          }

          WaveService.readTestSessions(
            function(sessions) {
              state.sessions = sessions || [];
              sessionsLoaded = true;
              finishIfDone();
            },
            function(status) {
              state.loading = false;
              state.error =
                "Failed to load test sessions from Strapi" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );

          WaveService.readDevices(
            function(devices) {
              const manufacturerMap = {};
              const hbbtvMap = {};
              (devices || []).forEach(function(device) {
                const deviceId = String(device.device_id || "").trim();
                if (deviceId === "") return;
                const manufacturer = String(device.manufacturer || "").trim();
                const hbbtvVersion = String(device.hbbtv_version || "").trim();
                if (manufacturer !== "") {
                  manufacturerMap[deviceId] = manufacturer;
                }
                if (hbbtvVersion !== "") {
                  hbbtvMap[deviceId] = hbbtvVersion;
                }
              });
              state.manufacturerByDeviceId = manufacturerMap;
              state.hbbtvByDeviceId = hbbtvMap;
              devicesLoaded = true;
              finishIfDone();
            },
            function(status) {
              state.loading = false;
              state.error =
                "Failed to load devices from Strapi" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );
        }

        function handleDelete(token) {
          if (!token) return;
          if (!window.confirm("Delete this test session from Strapi?")) {
            return;
          }

          WaveService.deleteTestSession(
            token,
            function() {
              state.sessions = state.sessions.filter(function(session) {
                return session.token !== token;
              });
              renderTable();
            },
            function(status) {
              state.error =
                "Failed to delete session" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );
        }

        window.onload = function() {
          loadSessions();
        };
      })();
    </script>
  </body>
</html>
