<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devices - Web Platform Test</title>
    <link rel="stylesheet" href="css/bulma-1.0.0/bulma.min.css" />
    <link rel="stylesheet" href="css/fontawesome-6.5.2.min.css" />
    <script src="lib/wave-service.js"></script>
    <style>
      .site-logo {
        max-width: 300px;
        margin: 0 0 30px -15px;
      }

      .status-box {
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <section class="section">
      <div class="container" style="margin-bottom: 2em">
        <a href="index.html">
          <img src="res/wavelogo_2016.jpg" class="site-logo" alt="WAVE" />
        </a>
        <h1 class="title">Devices</h1>
      </div>

      <div class="container" id="table-container"></div>
    </section>

    <script>
      (function() {
        const query = new URLSearchParams(window.location.search || "");
        const filterDeviceId = query.get("device_id");

        const state = {
          devices: [],
          loading: true,
          error: null,
          editingDeviceId: null,
          editValues: {
            manufacturer: "",
            model: "",
            year: "",
          },
          saving: false,
        };

        function escapeHtml(value) {
          return String(value || "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/\"/g, "&quot;")
            .replace(/'/g, "&#039;");
        }

        function renderStatus(container) {
          if (state.loading) {
            container.innerHTML =
              '<div class="level"><span class="level-item"><i class="fas fa-spinner fa-pulse"></i><span style="margin-left:0.4em;">Loading devices ...</span></span></div>';
            return true;
          }

          if (state.error) {
            container.innerHTML =
              '<article class="message is-danger status-box"><div class="message-body">' +
              escapeHtml(state.error) +
              "</div></article>";
            return true;
          }

          if (!state.devices || state.devices.length === 0) {
            container.innerHTML =
              '<div class="level"><span class="level-item">No devices available.</span></div>';
            return true;
          }

          return false;
        }

        function renderTable() {
          const container = document.getElementById("table-container");
          if (renderStatus(container)) return;

          function asDisplayText(value) {
            if (value === undefined || value === null) return "-";
            const text = String(value).trim();
            return text === "" ? "-" : text;
          }

          const rows = state.devices
            .map(function(device, index) {
              const deviceNumber =
                device.device_id !== undefined && device.device_id !== null
                  ? device.device_id
                  : index + 1;

              const deviceKey = String(device.device_id || "");
              const isEditing =
                deviceKey !== "" &&
                state.editingDeviceId !== null &&
                String(state.editingDeviceId) === deviceKey;

              const manufacturerCell = isEditing
                ? '<input class="input is-small device-edit-manufacturer" data-device-id="' +
                  escapeHtml(deviceKey) +
                  '" value="' +
                  escapeHtml(state.editValues.manufacturer) +
                  '" />'
                : escapeHtml(asDisplayText(device.manufacturer));

              const modelCell = isEditing
                ? '<input class="input is-small device-edit-model" data-device-id="' +
                  escapeHtml(deviceKey) +
                  '" value="' +
                  escapeHtml(state.editValues.model) +
                  '" />'
                : escapeHtml(asDisplayText(device.model));

              const yearCell = isEditing
                ? '<input class="input is-small device-edit-year" data-device-id="' +
                  escapeHtml(deviceKey) +
                  '" value="' +
                  escapeHtml(state.editValues.year) +
                  '" />'
                : escapeHtml(asDisplayText(device.year));

              const editButton =
                deviceKey === ""
                  ? "-"
                  : isEditing
                    ? '<button class="button is-small is-success device-save-button" data-device-id="' +
                      escapeHtml(deviceKey) +
                      '"' +
                      ' aria-label="Save" title="Save"' +
                      (state.saving ? " disabled" : "") +
                      '><span class="icon is-small"><i class="fas fa-floppy-disk" aria-hidden="true"></i></span></button>'
                    : '<button class="button is-small device-edit-button" data-device-id="' +
                      escapeHtml(deviceKey) +
                      '" aria-label="Edit" title="Edit"><span class="icon is-small"><i class="fas fa-pen" aria-hidden="true"></i></span></button>';

              return (
                "<tr>" +
                '<td class="is-narrow">' +
                escapeHtml(deviceNumber) +
                "</td>" +
                "<td>" +
                manufacturerCell +
                "</td>" +
                "<td>" +
                modelCell +
                "</td>" +
                "<td>" +
                yearCell +
                "</td>" +
                "<td>" +
                escapeHtml(device.user_agent) +
                "</td>" +
                '<td style="white-space: nowrap">' +
                escapeHtml(device.hbbtv_version) +
                "</td>" +
                '<td class="is-narrow has-text-centered">' +
                editButton +
                "</td>" +
                "</tr>"
              );
            })
            .join("");

          container.innerHTML =
            '<div style="overflow-x: auto">' +
            '<table class="table is-bordered is-hoverable is-fullwidth">' +
            "<thead>" +
            "<tr>" +
            '<th class="is-narrow">#Device</th>' +
            '<th class="is-narrow">Manufacturer</th>' +
            '<th class="is-narrow">Model</th>' +
            '<th class="is-narrow">Year</th>' +
            "<th>User Agent</th>" +
            '<th class="is-narrow">HbbTV Version</th>' +
            '<th class="is-narrow">Edit</th>' +
            "</tr>" +
            "</thead>" +
            "<tbody>" +
            rows +
            "</tbody>" +
            "</table>" +
            "</div>";

          Array.prototype.slice
            .call(container.querySelectorAll("button.device-edit-button[data-device-id]"))
            .forEach(function(button) {
              button.addEventListener("click", function() {
                const deviceId = button.getAttribute("data-device-id");
                const device = state.devices.find(function(it) {
                  return String(it.device_id || "") === String(deviceId || "");
                });
                if (!device) return;
                state.editingDeviceId = deviceId;
                state.editValues = {
                  manufacturer: device.manufacturer || "",
                  model: device.model || "",
                  year:
                    device.year !== undefined && device.year !== null
                      ? String(device.year)
                      : "",
                };
                state.error = null;
                renderTable();
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("button.device-save-button[data-device-id]"))
            .forEach(function(button) {
              button.addEventListener("click", function() {
                const deviceId = button.getAttribute("data-device-id");
                saveDeviceRow(deviceId);
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("input.device-edit-manufacturer[data-device-id]"))
            .forEach(function(input) {
              input.addEventListener("input", function() {
                state.editValues.manufacturer = input.value;
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("input.device-edit-model[data-device-id]"))
            .forEach(function(input) {
              input.addEventListener("input", function() {
                state.editValues.model = input.value;
              });
            });

          Array.prototype.slice
            .call(container.querySelectorAll("input.device-edit-year[data-device-id]"))
            .forEach(function(input) {
              input.addEventListener("input", function() {
                state.editValues.year = input.value;
              });
            });
        }

        function saveDeviceRow(deviceId) {
          if (!deviceId) return;

          const manufacturer = String(state.editValues.manufacturer || "").trim();
          const model = String(state.editValues.model || "").trim();
          const yearText = String(state.editValues.year || "").trim();

          let year = null;
          if (yearText !== "") {
            if (!/^\d+$/.test(yearText)) {
              state.error = "Year must be an integer";
              renderTable();
              return;
            }
            year = parseInt(yearText, 10);
          }

          state.saving = true;
          state.error = null;
          renderTable();

          WaveService.updateDevice(
            deviceId,
            {
              manufacturer: manufacturer,
              model: model,
              year: year,
            },
            function() {
              state.devices = state.devices.map(function(device) {
                if (String(device.device_id || "") !== String(deviceId || "")) {
                  return device;
                }
                return {
                  device_id: device.device_id,
                  manufacturer: manufacturer,
                  model: model,
                  year: year,
                  user_agent: device.user_agent,
                  hbbtv_version: device.hbbtv_version,
                };
              });
              state.saving = false;
              state.editingDeviceId = null;
              state.editValues = {
                manufacturer: "",
                model: "",
                year: "",
              };
              renderTable();
            },
            function(status) {
              state.saving = false;
              state.error =
                "Failed to update device" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );
        }

        function loadDevices() {
          state.loading = true;
          state.error = null;
          renderTable();

          WaveService.readDevices(
            function(devices) {
              let loadedDevices = devices || [];
              if (filterDeviceId && String(filterDeviceId).trim() !== "") {
                loadedDevices = loadedDevices.filter(function(device) {
                  return String(device.device_id || "") === String(filterDeviceId);
                });
              }
              state.devices = loadedDevices;
              state.loading = false;
              renderTable();
            },
            function(status) {
              state.loading = false;
              state.error =
                "Failed to load devices from Strapi" +
                (status ? " (HTTP " + status + ")" : "");
              renderTable();
            }
          );
        }

        window.onload = function() {
          loadDevices();
        };
      })();
    </script>
  </body>
</html>
